{% extends 'students/base_student.html' %}
{% block title %}Password Updated | PIST{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-160px)] py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md bg-white border border-outline-variant rounded-lg shadow-sm relative z-10 flex flex-col p-8 md:p-10 text-center">
        
        <div class="w-20 h-20 bg-secondary/10 text-secondary rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-[40px]">check_circle</span>
        </div>
        
        <h1 class="font-headline-md text-headline-md text-primary tracking-tight mb-4">Password Updated</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mb-8">
            Your password has been changed successfully.
        </p>
        
        <a class="w-full bg-primary text-on-primary font-title-md text-title-md py-3 px-8 rounded-sm hover:bg-primary-container transition-all focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 shadow-sm flex items-center justify-center gap-2" href="{% url 'students:login' %}">
            <span class="material-symbols-outlined text-[20px]">login</span> Sign In
        </a>

    </div>
</div>
{% endblock %}
