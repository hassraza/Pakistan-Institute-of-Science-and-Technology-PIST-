{% extends 'students/base_student.html' %}{% block content %}<section class="auth-layout auth-layout--single"><form class="auth-card" method="post"><p class="eyebrow">Account recovery</p><h1>Reset your password</h1><p class="muted">Enter your account email. We will send instructions if it belongs to a student account.</p>{% csrf_token %}<div class="field"><label for="id_email">Email address</label>{{ form.email }}{% for error in form.email.errors %}<span class="error">{{ error }}</span>{% endfor %}</div><button class="button" type="submit">Send reset link</button></form></section>{% endblock %}
