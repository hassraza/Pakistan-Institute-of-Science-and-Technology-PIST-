{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}PIST is a fictional academic institution developed for a university admission ecosystem project.{% endblock %}">
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-highest": "#e1e3e4", "tertiary-container": "#cea72c", "inverse-surface": "#2e3132", "outline": "#74777f",
            "error-container": "#ffdad6", "inverse-on-surface": "#f0f1f2", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff",
            "primary-fixed-dim": "#adc8f5", "secondary-fixed": "#afeee9", "tertiary-fixed": "#ffe08e", "on-tertiary-fixed-variant": "#584400",
            "on-secondary-fixed-variant": "#02504c", "surface-tint": "#455f87", "on-tertiary-fixed": "#241a00", "secondary-fixed-dim": "#93d2cc",
            "on-primary-fixed": "#001b3b", "on-surface": "#191c1d", "primary-container": "#0f2d52", "primary-fixed": "#d5e3ff",
            "surface-container": "#edeeef", "tertiary": "#755b00", "primary": "#001835", "on-primary-container": "#7b95c0",
            "surface-container-low": "#f3f4f5", "on-tertiary": "#ffffff", "error": "#ba1a1a", "on-tertiary-container": "#4f3d00",
            "on-surface-variant": "#43474e", "surface-dim": "#d9dadb", "on-primary-fixed-variant": "#2d476e", "surface": "#f8f9fa",
            "outline-variant": "#c4c6cf", "on-secondary": "#ffffff", "tertiary-fixed-dim": "#ecc246", "on-secondary-fixed": "#00201e",
            "surface-container-high": "#e7e8e9", "on-error": "#ffffff", "surface-variant": "#e1e3e4", "on-error-container": "#93000a",
            "on-secondary-container": "#2d6c68", "on-background": "#191c1d", "surface-bright": "#f8f9fa", "background": "#f8f9fa",
            "secondary": "#286864", "inverse-primary": "#adc8f5", "secondary-container": "#acebe6"
          },
          "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
          "spacing": { "gutter": "24px", "container-max": "1280px", "md": "24px", "xl": "80px", "base": "4px", "sm": "16px", "margin-mobile": "16px", "xs": "8px", "lg": "48px" },
          "fontFamily": { "headline-lg": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "display-lg-mobile": ["Inter"], "title-md": ["Inter"], "title-lg": ["Inter"], "display-lg": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Inter"] },
          "fontSize": {
            "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
            "display-lg-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
            "title-md": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
            "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
            "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined[data-weight="fill"] { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .utility-bar { background-color: #0F2D52; color: white; font-size: 12px; font-weight: 500; letter-spacing: 0.05em; }
    .gold-cta { background-color: #C9A227; color: #0F2D52; }
  </style>
  <link rel="stylesheet" href="{% static 'css/pist.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'partials/navbar.html' %}
  <main class="site-main">
    {% include 'partials/messages.html' %}
    {% block content %}{% endblock %}
  </main>
  {% include 'partials/footer.html' %}
  <script src="{% static 'js/pist.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
